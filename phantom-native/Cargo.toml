[package]
name    = "phantom-native"
version = "0.2.0"
edition = "2021"

[lib]
name       = "phantom_native"
crate-type = ["cdylib"]

[dependencies]
pyo3    = { version = "0.21", features = ["extension-module"] }
memchr  = "2"
goblin  = "0.8"
rayon   = "1"
regex   = "1.10"     # Sprint 10: parallel pattern matching için

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
