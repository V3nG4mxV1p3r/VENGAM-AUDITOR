# VENGAM — Community Rules: Credential Exposure
---
id: VENGAM-CRED-001
title: "Unity Services Key in Assets"
description: >
  Unity servis anahtarı assets klasöründe düz metin olarak saklanıyor.
  Resources/, StreamingAssets/ veya JSON config dosyalarında tespit edildi.
severity: CRITICAL
confidence: HIGH
category: GameEngine
platform: android
tags: [unity, credentials, assets, config]
score_value: 30

detection:
  patterns:
    - '(?i)(unity[_\-]?(services|gaming|analytics|cloud)[_\-]?(key|secret|token))\s*[=:\"]+\s*[a-zA-Z0-9\-_]{20,}'
    - '(?i)"(projectId|organizationId|serviceAccountKey)"\s*:\s*"[a-zA-Z0-9\-_]{10,}"'
  file_ext: [.json, .txt, .xml, .properties, .yml, .yaml]

context:
  exclude_paths: [test, sample, example, mock]

simulation: >
  Saldırgan assets klasörünü çıkartır, Unity Cloud API'yi çağırır,
  build artifact'larına ve kaynak koduna erişir.
triage_note: >
  Unity servis anahtarları APK içinde OLMAMALI.
  Runtime'da sunucudan çekilmeli, Android Keystore'da saklanmalı.
cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N"
cwe_id: "CWE-798"
owasp_ref: "M9: Insecure Data Storage"
references:
  - https://docs.unity.com/ugs/en-us/manual/overview/manual/security-best-practices

---
id: VENGAM-CRED-002
title: "Hardcoded Backend URL with Credentials"
description: >
  Backend URL'si içinde kullanıcı adı veya şifre gömülü.
  http://user:pass@api.game.com formatında tespit edildi.
severity: CRITICAL
confidence: HIGH
category: General
platform: both
tags: [credentials, url, basic-auth, hardcoded]
score_value: 35

detection:
  patterns:
    - 'https?://[a-zA-Z0-9_\-\.]+:[a-zA-Z0-9_\-\.@!#$%^&*]{4,}@[a-zA-Z0-9\-\.]+'
    - '(?i)(Authorization|auth_token|api_key)\s*[=:]\s*["\']Basic\s+[A-Za-z0-9+/=]{10,}'

context:
  exclude_paths: [test, sample, example]

simulation: >
  Saldırgan URL'yi APK'dan çıkartır, credential'ları kullanarak
  backend'e direkt erişir ve tüm oyuncu verilerini çalar.
triage_note: >
  URL içine credential GÖMÜLMEMELİ. OAuth2 veya API token kullan.
  Credential'lar her zaman güvenli depolamadan (Keystore) alınmalı.
cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
cwe_id: "CWE-312"
owasp_ref: "M9: Insecure Data Storage"

---
id: VENGAM-CRED-003
title: "Encryption Key in SharedPreferences Path"
description: >
  Şifreleme anahtarı SharedPreferences'a yazılıyor.
  SharedPreferences şifrelenmediği için adb backup ile çıkartılabilir.
severity: HIGH
confidence: MEDIUM
category: Config
platform: android
tags: [encryption, sharedprefs, key-storage]
score_value: 22

detection:
  patterns:
    - '(?i)(putString|putBytes|edit\(\)\.put)[^;]*?(key|secret|token|password|aes|rsa)'
    - '(?i)SharedPreferences[^;]*(encryption|crypto|cipher|aes|rsa)[_\s]?key'
  file_ext: [.smali, .java, .kt]

context:
  exclude_paths: [androidx, test]
  require_keywords: [key, secret, encrypt, crypto]

simulation: >
  Saldırgan 'adb backup com.game.app' ile SharedPreferences dump'ını alır,
  şifreleme anahtarını çıkartır ve şifreli verileri çözer.
triage_note: >
  Şifreleme anahtarları Android Keystore'da saklanmalı.
  EncryptedSharedPreferences (Jetpack Security) kullan.
frida_hook: |
  Java.perform(function() {
    try {
      var SPI = Java.use('android.app.SharedPreferencesImpl');
      SPI.getString.overload('java.lang.String','java.lang.String').implementation = function(key, def) {
        var r = this.getString(key, def);
        var k = key ? key.toLowerCase() : '';
        if (k.indexOf('key') !== -1 || k.indexOf('encrypt') !== -1 ||
            k.indexOf('secret') !== -1 || k.indexOf('cipher') !== -1) {
          send({tag:'SHAREDPREFS_KEY', msg:'Key access: '+key+' = '+(r?r.substring(0,20)+'...':'null')});
        }
        return r;
      };
    } catch(_) {}
  });
cvss_vector: "CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
cwe_id: "CWE-312"
owasp_ref: "M2: Insecure Data Storage"
